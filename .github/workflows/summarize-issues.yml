name: 新issue摘要

on:
  issues:
    types: [opened]  # 监听新issue打开事件

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest  # 在最新版Ubuntu上运行
    permissions:
      issues: write  # 写入issue权限
      models: read   # 读取模型权限
      contents: read # 读取内容权限

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          token: ${{ github.token }}

      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 运行AI推理
        id: inference
        uses: actions/ai-inference@334892bb203895caaed82ec52d23c1ed9385151e # v2.0.4
        with:
          prompt: |  # 设置AI提示词
            用一段话总结以下GitHub issue:
            标题: ${{ github.event.issue.title }}
            内容: ${{ github.event.issue.body }}

      - name: 添加AI摘要评论
        run: |  # 使用gh命令添加评论
          gh issue comment $ISSUE_NUMBER --body '${{ steps.inference.outputs.response }}'
        env:
          GH_TOKEN: ${{ github.token }}  # GitHub token
          ISSUE_NUMBER: ${{ github.event.issue.number }}  # issue编号
          RESPONSE: ${{ steps.inference.outputs.response }}  # AI响应内容